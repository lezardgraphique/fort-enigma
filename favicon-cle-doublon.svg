<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="50%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#a8791c"/>
    </radialGradient>
  </defs>

  <!-- fond rond, couleur d'accueil du jeu -->
  <circle cx="32" cy="32" r="31" fill="#0f121a"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>

  <!-- clé : reprend l'anneau + panneton du jeu (thème "fort"), orientée comme au démarrage -->
  <g transform="translate(24,30) rotate(90)">
    <!-- anneau de la clé -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="url(#keyGrad)" stroke-width="4.5"/>
    <!-- doublon logé dans l'anneau -->
    <circle cx="0" cy="0" r="7.5" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="#8a5a1c" stroke-width="0.8"/>
    <path d="M0 -4.2 V4.2 M-2.6 -1.6 h5.2 M-2.6 1.6 h5.2" stroke="#141926" stroke-width="1.3" stroke-linecap="round"/>
    <!-- tige et dents de la clé -->
    <rect x="9" y="-2.2" width="20" height="4.4" fill="url(#keyGrad)"/>
    <rect x="24" y="0" width="4" height="6" fill="url(#keyGrad)"/>
    <rect x="30" y="0" width="4" height="8.5" fill="url(#keyGrad)"/>
  </g>
</svg>
