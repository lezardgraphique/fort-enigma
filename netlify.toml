# Le jeu est un fichier statique : rien a compiler.
[build]
  publish = "."
  command = ""

# Le fichier fait ~5,5 Mo : on le laisse en cache court pour que les
# mises a jour arrivent vite, mais on autorise la revalidation.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le service worker doit toujours etre relu, sinon les mises a jour
# du jeu resteraient bloquees derriere une ancienne version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
