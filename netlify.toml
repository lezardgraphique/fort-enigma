# Le jeu est un fichier statique : rien a compiler.
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Remarque : la variable AWS_LAMBDA_JS_RUNTIME (qui force la version de
# Node pour les fonctions) doit se regler via l'UI/CLI/API Netlify -- elle
# n'a aucun effet placee ici dans netlify.toml. Sans reglage, le runtime
# suit la version de Node du build (repli Node 24 par defaut), largement
# suffisant pour gardien-chat.mjs (qui utilise fetch() nativement).

[functions]
  node_bundler = "esbuild"

# Le fichier fait ~2,5 Mo : on le laisse en cache court pour que les
# mises a jour arrivent vite, mais on autorise la revalidation.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Une CSP est deja declaree dans <head> d'index.html (balise meta) et
    # sert de politique principale, deja alignee sur les 5 domaines meteo/
    # geolocalisation IP reellement utilises par le jeu. Celle-ci la reprend
    # a l'identique pour rester coherente, avec un seul ajout : frame-ancestors,
    # qui ne peut etre efficace que via un en-tete HTTP (les navigateurs
    # l'ignorent silencieusement dans une balise meta) et remplace X-Frame-Options
    # de facon plus moderne pour la protection anti-clickjacking.
    # frame-ancestors autorise uniquement l'interface Netlify (app.netlify.com
    # et les domaines *.netlify.app/*.netlify.com) a afficher le jeu dans un
    # cadre : sans cela, l'apercu integre a Netlify etait bloque et affichait
    # « site introuvable ». Tout autre site reste interdit (anti-clickjacking).
    # X-Frame-Options a ete retire : sa seule valeur possible ici (DENY)
    # bloquait aussi l'apercu, et frame-ancestors le remplace.
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://ipapi.co https://ipwho.is https://get.geojs.io; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests; frame-ancestors 'self' https://app.netlify.com https://*.netlify.app https://*.netlify.com"

# Mode hors connexion : le service worker doit toujours etre relu pour que
# les mises a jour du jeu arrivent sans attendre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Les adresses de branche et de déploiement (main--…, <id>--…) répondent
# « Site not found » pour ce projet : on renvoie vers l'adresse principale.
[[redirects]]
  from = "https://main--fort-enigma.netlify.app/*"
  to = "https://fort-enigma.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://main--fort-enigma.netlify.app/*"
  to = "https://fort-enigma.netlify.app/:splat"
  status = 301
  force = true

