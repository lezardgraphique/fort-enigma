# Le jeu est un fichier statique : rien a compiler.
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Remarque : la variable AWS_LAMBDA_JS_RUNTIME (qui force la version de
# Node pour les fonctions) doit se regler via l'UI/CLI/API Netlify -- elle
# n'a aucun effet placee ici dans netlify.toml. Sans reglage, le runtime
# suit la version de Node du build (repli Node 24 par defaut), largement
# suffisant pour les fonctions du Fort (fetch() natif ; aucune API d’IA).

[functions]
  node_bundler = "esbuild"

# Le fichier fait ~2,5 Mo : on le laisse en cache court pour que les
# mises a jour arrivent vite, mais on autorise la revalidation.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # script-src : aucun 'unsafe-inline' ; chaque script en ligne d'index.html est autorise par
    # son empreinte SHA-256, recalculee par `python3 outils/csp.py` (verifiee en CI).
    # Une CSP est deja declaree dans <head> d'index.html (balise meta) et
    # sert de politique principale, deja alignee sur les 5 domaines meteo/
    # geolocalisation IP reellement utilises par le jeu. Celle-ci la reprend
    # a l'identique pour rester coherente, avec un seul ajout : frame-ancestors,
    # qui ne peut etre efficace que via un en-tete HTTP (les navigateurs
    # l'ignorent silencieusement dans une balise meta) et remplace X-Frame-Options
    # de facon plus moderne pour la protection anti-clickjacking.
    # frame-ancestors autorise uniquement l'interface Netlify (app.netlify.com
    # et les domaines *.netlify.app/*.netlify.com) a afficher le jeu dans un
    # cadre : sans cela, l'apercu integre a Netlify etait bloque et affichait
    # « site introuvable ». Tout autre site reste interdit (anti-clickjacking).
    # X-Frame-Options a ete retire : sa seule valeur possible ici (DENY)
    # bloquait aussi l'apercu, et frame-ancestors le remplace.
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-LS1lF1fGC7f0Etvc2yE6gzzg6gE0r1VLjG2Vq5hk3DA=' 'sha256-idUY4H/ONDPHs2LZxl85ia1bZRXqhMhOjnzZDV6f4Vk=' 'sha256-fuD7ssCDg2f3OIQmJbt+Qy5m+gGOScbF7h1mftRskxQ=' 'sha256-HMh/oGbEi7hu5INY6gnq9CU2SQ70DcpzGEuYxhEKxAM=' 'sha256-RAfgAw0+ytaicDjIhj9en3toJ6QPPq4Tjn8+2/IhxV8=' 'sha256-n9HSFqr5JK4AKWJJF3lr315Z2dsNguETRaAPb3M6eoE=' 'sha256-tIeQA58bq1cVIwipzo3vi7MNAX47fhLLVr0lqZr8Vu0=' 'sha256-WzVnURpdsQindWJHRJH2BdZD0yeJFlO+Mge2fQLZYPI=' 'sha256-jwoTtnZZmBk0ITmNVXpFJIbIfOdoT0s4RI/RCyU63Y4=' 'sha256-I+Rj3u/GSug4Y8tfDIYpssLh69GJJ1iKQwK3xjVFDFU=' 'sha256-xXZzv2MrG2FoFl+jvBYW8d3X70BFGQ8FOWlq4PJF+2Y=' 'sha256-5V7EF4J3615t3LzU4w+OGeAPYWN3T/jLWR6e81TNMiY=' 'sha256-JPx8lqetT+ZQnfszcYZQ+S0CzRBhLqdOWTG7E7hRGWk=' 'sha256-+0ufqtBkHx9HD7gKkytUAtoteGz0FpyxjBQTJfo2bGo=' 'sha256-cah93P4zEQwPPq+H/lOsPPF5dRNWZu5FTfQND3Fg+Ag=' 'sha256-UMcBFRidSDE9Gh1RZtfKVahsn6/zkz8Uwdi692ryayM=' 'sha256-OYpDG/PPRTkLqWzvTAyrRf2EqKlX7ITnReEkJ/5UA9A=' 'sha256-RRAUJnkf4wCauyuy4xRcvF/5XJosModve6nBa/ls2W4=' 'sha256-MBrtD3GUloYoeRCv7LamOQtVy6JOuv2h6aTHK6YIZbo=' 'sha256-P47V/LBUy0hI1G8yJlTrla7G2hIl1YBi5KLU0Z6m6zw=' 'sha256-Wx75ji8VzUcVb3IlgQ53Qg7b8kvuD0OOWaveYRCDoBY=' 'sha256-nDXrJ7zPmYbYzLcRcOBesDqG9nieAb052hrCOh8wAes=' 'sha256-lkIVB6QoTMiJzcJBtnWIG76cNw0/psLkYZan0qLfqnc=' 'sha256-byAb5Gq7rFjs2gdyUxSTTq+2BXXDDd3ZA2wlkwu76Ew=' 'sha256-zMNto+iF4YC1/U/ArAsnJxCBEAENkZRyt6ZZWkWt//8=' 'sha256-o5Y2neWHQDLG2+Khw4Dt2Wz01/jfRkvvqRZJNgLnPxo=' 'sha256-apyFS/qZHFF3IxJZNcYOc/+yUdRY7D77s8bCq+wYoJA=' 'sha256-fctlUZi+HfCb1c/lsFjkmsFxPWvOmReb76x1XM1QGno=' 'sha256-jzBNZm06RrvEzn8Mq/dtWtCiZMbHkZT4RyzaJ79P+1A=' 'sha256-MoyKzmWr/mLsvmvqyNmCBF9JsIkKztvyKGhh5GdHzDU=' 'sha256-gFCiZGZth+wlP15v8cLRz+RUGaliQyUTHPuQ5FKglxU=' 'sha256-2crYZ2YyMGsiZpc8tPhWWwrvA70gUwYuExdMDz6RYFU=' 'sha256-9pWMTOlvMZ0bsdWkQjnC2+HvePBYHijVJOEhG2nyh6A=' 'sha256-iYyTxxn10xU+Uy9xEcGwcRqazZnoohYjpEi0yQRDfEA=' 'sha256-2MptG7x18FcNeXnhT0sNKcinltx/ID93qMch9HsieB0=' 'sha256-Bu+povyTbV0P7hht0X4shITgrOqu6+VVaTNT7rIV