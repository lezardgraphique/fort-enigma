name: Applications (PC et Android)

# Construit Fort Énigma en applications installables :
#   - PC : Windows (.msi / .exe), macOS (.dmg), Linux (.AppImage / .deb) avec Tauri ;
#   - Android : un .apk avec Capacitor (version de test, non signée pour le Play Store).
# Se lance à la main (onglet Actions → « Applications » → Run workflow) ou à
# chaque étiquette v* (ex. git tag v1.0 && git push --tags). Les fichiers sont
# à télécharger en bas de la page de l'exécution (« Artifacts »).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pc:
    name: PC (${{ matrix.nom }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: macos-latest
            nom: macOS
          - os: ubuntu-22.04
            nom: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: portage/src-tauri
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Préparer le jeu embarqué
        working-directory: portage
        run: npm ci && node preparer.mjs
      - name: Construire l'application
        working-directory: portage
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: fort-enigma-${{ matrix.nom }}
          path: |
            portage/src-tauri/target/release/bundle/msi/*.msi
            portage/src-tauri/target/release/bundle/nsis/*.exe
            portage/src-tauri/target/release/bundle/dmg/*.dmg
            portage/src-tauri/target/release/bundle/appimage/*.AppImage
            portage/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Préparer le jeu et le projet Android
        working-directory: portage
        run: |
          npm ci
          node preparer.mjs
          npx cap add android
          npx cap sync android
          # icônes de l'application (générées depuis icone-512.png)
          cp -r src-tauri/icons/android/* android/app/src/main/res/ || true
      - name: Construire l'APK
        working-directory: portage/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fort-enigma-Android
          path: portage/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
