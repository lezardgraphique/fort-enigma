name: "CodeQL"

# Configuration avancée : on choisit nous-memes les langages a analyser
# (JavaScript/TypeScript + Python), sans passer par le "Default setup"
# de GitHub qui inclut aussi le langage "GitHub Actions" -- celui qui
# provoquait les erreurs "CodeQL exited with errors" / "No GitHub
# Actions code found" sur ce depot.
#
# IMPORTANT : le "Default setup" doit etre desactive avant d'activer ce
# fichier, sinon GitHub refuse de faire cohabiter les deux configurations
# (Settings -> Code security and analysis -> Code scanning -> Default ->
# Switch to advanced, ou simplement Disable).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Chaque lundi a 6h12 UTC -- heure decalee pour eviter les pics de
    # charge que provoquerait un "00 6 * * 1" pile a l'heure ronde.
    - cron: '12 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: Analyser (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyser
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
