name: Publier sur GitHub Pages

# Ne publie que si la verification a reussi : c'est le garde-fou qui evite
# de mettre en ligne une regression.
on:
  workflow_run:
    workflows: ["Vérification du jeu"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le site (jeu seul, sans les outils)
        run: |
          mkdir -p site
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
