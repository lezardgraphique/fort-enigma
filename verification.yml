name: Vérification du jeu

# Lance les filets de sécurité à chaque envoi et sur chaque proposition
# de modification. Node est installé AVANT l'audit Python : reparer.py
# s'appuie sur node --check pour analyser le JavaScript sans faux positif,
# et ne fonctionne correctement que si node est déjà sur le PATH à ce
# moment-là — l'ordre des étapes ci-dessous n'est pas arbitraire.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auditer le fichier (reparer.py, avec node --check)
        run: python3 outils/reparer.py index.html

      - name: Vérifier la syntaxe de la fonction serverless du Gardien
        run: node --check netlify/functions/gardien-chat.js

      - name: Chercher une clé API oubliée dans le dépôt
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E "sk-ant-[A-Za-z0-9_-]{10,}" .; then
            echo "::error::Une cle ressemblant a une cle API Anthropic est presente dans le depot. Retirez-la et revoquez-la immediatement."
            exit 1
          fi
          echo "Aucune cle API detectee dans les fichiers versionnes."

      - name: Installer Puppeteer
        run: npm install puppeteer@^23.0.0

      - name: Tester le jeu en conditions réelles (verifier.js)
        run: node outils/verifier.js index.html

      - name: Conserver les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-echec
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 7
