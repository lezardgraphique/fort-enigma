name: Vérification du jeu

# Lance les deux filets de sécurité à chaque envoi et sur chaque proposition
# de modification. L'audit du fichier passe en premier : il est instantané et
# attrape les fautes structurelles avant qu'on démarre un navigateur.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auditer le fichier (reparer.py)
        run: python3 outils/reparer.py index.html

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Puppeteer
        run: npm install puppeteer@^23.0.0

      - name: Tester le jeu en conditions réelles (verifier.js)
        run: node outils/verifier.js index.html

      - name: Conserver les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-echec
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 7
